<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Создание заявки</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root{
      --bg-gradient: linear-gradient(135deg,#ede9fe,#f5f3ff);
      --card-bg:#fff;
      --primary:#7c3aed;
      --primary-hover:#6d28d9;
      --text-main:#1f2937;
      --text-muted:#6b7280;
      --border:#e5e7eb;
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; padding:16px;
      background:var(--bg-gradient);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text-main);
    }
    .container{max-width:460px;margin:0 auto}
    .header{text-align:center;margin:12px 0 18px}
    .header h1{font-size:22px;margin:0}
    .header p{font-size:14px;color:var(--text-muted);margin:6px 0 0}
    .card{
      background:var(--card-bg);
      border-radius:var(--radius);
      padding:20px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }
    label{display:block;font-size:14px;margin:12px 0 6px;color:var(--text-muted)}
    input, textarea, select{
      width:100%;
      padding:12px 14px;
      font-size:16px;
      border-radius:12px;
      border:1px solid var(--border);
      outline:none;
      transition:border .15s, box-shadow .15s;
      background:#fff;
    }
    input:focus, textarea:focus, select:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(124,58,237,.15);
    }
    textarea{resize:none}
    .row{display:flex;gap:12px}
    .row>div{flex:1}
    .submit{
      width:100%;
      margin-top:16px;
      padding:14px;
      border-radius:14px;
      border:none;
      background:var(--primary);
      color:#fff;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:background .15s, transform .05s;
    }
    .submit:hover{background:var(--primary-hover)}
    .submit:active{transform:scale(.98)}
    .footer{text-align:center;font-size:12px;color:var(--text-muted);margin-top:12px}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Создание заявки</h1>
      <p>Заполните данные перевозки</p>
    </div>

    <div class="card">
      <label>Откуда</label>
      <input id="pickup" placeholder="Адрес отправления" />

      <label>Куда</label>
      <input id="delivery" placeholder="Адрес доставки" />

      <label>Дата и время доставки</label>
      <input id="delivery_dt" type="datetime-local" />

      <div class="row">
        <div>
          <label>Тип контейнера</label>
          <select id="container_type">
            <option value="">Выберите…</option>
            <option value="20DC">20’ DC</option>
            <option value="40DC">40’ DC</option>
            <option value="40HC">40’ HC</option>
            <option value="45HC">45’ HC</option>
            <option value="OTHER">Другое</option>
          </select>
        </div>
        <div>
          <label>Номер контейнера</label>
          <input id="container_number" placeholder="Напр. ABCD1234567" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>Вес груза, кг</label>
          <input id="cargo_weight" type="number" step="1" placeholder="Напр. 8900" />
        </div>
        <div>
          <label>Наименование груза</label>
          <input id="cargo_name" placeholder="Напр. Автомобили легковые" />
        </div>
      </div>

      <label>Комментарий (необязательно)</label>
      <textarea id="comment" rows="3" placeholder="Детали, пожелания…"></textarea>

      <button class="submit" id="send">Создать заявку</button>
    </div>

    <div class="footer">Данные отправляются безопасно</div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();

    const N8N_WEBHOOK_URL = "https://n8n.routoptics.ru/webhook/api/create_request";

    function normalizeDatetimeLocal(v){
      // datetime-local приходит как "YYYY-MM-DDTHH:MM"
      // отправим как "YYYY-MM-DDTHH:MM:00"
      if (!v) return null;
      return v.length === 16 ? `${v}:00` : v;
    }

    document.getElementById('send').onclick = async () => {
      const pickup = document.getElementById('pickup').value.trim();
      const delivery = document.getElementById('delivery').value.trim();
      const delivery_dt = normalizeDatetimeLocal(document.getElementById('delivery_dt').value);

      const container_type = document.getElementById('container_type').value || null;
      const container_number = document.getElementById('container_number').value.trim() || null;

      const cargo_weight_raw = document.getElementById('cargo_weight').value;
      const cargo_weight = cargo_weight_raw ? Number(cargo_weight_raw) : null;

      const cargo_name = document.getElementById('cargo_name').value.trim() || null;
      const comment = document.getElementById('comment').value.trim() || null;

      if (!pickup || !delivery || !delivery_dt) {
        tg?.showPopup({ title: "Ошибка", message: "Заполните: Откуда, Куда, Дата и время доставки" });
        return;
      }

      const payload = {
        initData: tg?.initData || null,
        user: tg?.initDataUnsafe?.user || null,
        form: {
          pickup_address: pickup,
          delivery_address: delivery,
          delivery_datetime: delivery_dt,

          container_type,
          container_number,

          cargo_weight,
          cargo_name,

          comment
        }
      };

      try {
        const r = await fetch(N8N_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const resp = await r.json().catch(() => ({}));
        if (!r.ok || resp.ok === false) throw new Error("send_failed");

        tg?.showPopup({
          title: "Готово",
          message: `Заявка создана ✅${resp.request_id ? " №" + resp.request_id : ""}`
        });
      } catch (e) {
        tg?.showPopup({ title: "Ошибка", message: "Не удалось отправить заявку" });
      }
    };
  </script>
</body>
</html>
